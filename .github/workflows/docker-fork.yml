---
# Builds a linux/amd64 Prometheus image from a fork branch and pushes it to
# ghcr.io/<owner>/prometheus. Not meant for upstream: it only runs on docker/**
# branches, which upstream never has.
name: Fork docker image
on:
  push:
    branches: ['docker/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and push image to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/prometheus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Keep in sync with .promu.yml.
          go-version: '1.27'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "web/ui/.nvmrc"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "<13.0.0"
      - name: Build UI assets and binaries
        run: make build
      - name: Stage binaries for the Dockerfile
        run: |
          mkdir -p .build/linux-amd64
          cp prometheus promtool .build/linux-amd64/
      - name: Build image
        run: |
          tag="${GITHUB_REF_NAME#docker/}"
          docker build \
            --build-arg ARCH=amd64 --build-arg OS=linux \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "${IMAGE}:${tag}" \
            -t "${IMAGE}:${tag}-${GITHUB_SHA::8}" \
            .
      - name: Push image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push --all-tags "${IMAGE}"
